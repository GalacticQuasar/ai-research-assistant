[project]
name = "backend"
version = "0.1.0"
description = "AI Research Assistant backend (FastAPI)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "openai>=3.28.0",
    "pypdf>=6.20.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mutmut==3.8.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.mutmut]
source_paths = ["app/"]
pytest_add_cli_args_test_selection = ["tests/"]
# mutmut needs a green baseline: leave out the tests that fail on known app bugs
pytest_add_cli_args = [
    "--deselect", "tests/test_api.py::test_upload_falls_back_when_llm_returns_non_object_json",
    "--deselect", "tests/test_api.py::test_get_pdf_when_file_was_removed_from_disk",
    "--deselect", "tests/test_llm.py::test_extract_metadata_non_object_json_raises_llm_error[null]",
    "--deselect", "tests/test_llm.py::test_extract_metadata_non_object_json_raises_llm_error[[\"Title\", \"Ada\"]]",
    "--deselect", "tests/test_llm.py::test_extract_metadata_non_object_json_raises_llm_error[\"just a string\"]",
    "--deselect", "tests/test_llm.py::test_extract_metadata_authors_string_is_not_split_into_characters",
]
